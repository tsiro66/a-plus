content:
  - name: home
    label: Αρχική
    type: file
    path: src/content/pages/home.json
    format: json
    fields:
      - name: heroTitle
        label: Τίτλος κύριας ενότητας
        type: string
        required: true
      - name: heroText
        label: Κείμενο κύριας ενότητας
        type: text
        required: true
      - name: heroImage
        label: Φωτογραφία κύριας ενότητας
        type: image
        required: true
      - name: aboutCardTitle
        label: Τίτλος κάρτας «Ποιοι είμαστε»
        type: string
        required: true
      - name: aboutCardText
        label: Κείμενο κάρτας «Ποιοι είμαστε»
        type: text
        required: true
      - name: servicesCardTitle
        label: Τίτλος κάρτας «Τι προσφέρουμε»
        type: string
        required: true
      - name: servicesCardText
        label: Κείμενο κάρτας «Τι προσφέρουμε»
        type: text
        required: true
      - name: workTitle
        label: Τίτλος ενότητας έργων
        type: string
        required: true
      - name: workText
        label: Κείμενο ενότητας έργων
        type: text
        required: true
      - name: noProjectsText
        label: Κείμενο όταν δεν υπάρχουν έργα
        type: string
        required: true

  - name: about
    label: Ποιοι είμαστε
    type: file
    path: src/content/pages/about.json
    format: json
    fields:
      - name: introTitle
        label: Τίτλος
        type: string
        required: true
      - name: introText
        label: Εισαγωγικό κείμενο
        type: text
        required: true
      - name: introQuote
        label: Κείμενο πράσινης κάρτας
        type: text
        required: true
      - name: team
        label: Ομάδα
        type: object
        list: true
        fields:
          - name: color
            label: Χρώμα κάρτας
            type: select
            required: true
            options:
              values:
                - name: forest
                  label: Forest (πράσινο σκούρο)
                - name: blue
                  label: Μπλε
                - name: pink
                  label: Ροζ
                - name: gray
                  label: Γκρι
                - name: orange
                  label: Πορτοκαλί
                - name: green
                  label: Πράσινο
          - name: name
            label: Όνομα
            type: string
            required: true
          - name: role
            label: Ιδιότητα
            type: string
            required: true
          - name: bio
            label: Βιογραφικό
            type: text
            required: true
          - name: interests
            label: Ενδιαφέροντα (προαιρετικό)
            type: string

  - name: services
    label: Υπηρεσίες
    type: file
    path: src/content/pages/services.json
    format: json
    fields:
      - name: introTitle
        label: Τίτλος
        type: string
        required: true
      - name: introText
        label: Εισαγωγικό κείμενο
        type: text
        required: true
      - name: introQuote
        label: Κείμενο κάρτας περιγραφής
        type: text
        required: true
      - name: items
        label: Υπηρεσίες
        type: object
        list: true
        fields:
          - name: title
            label: Τίτλος υπηρεσίας
            type: string
            required: true
          - name: description
            label: Περιγραφή υπηρεσίας
            type: text
            required: true
      - name: closingText
        label: Κείμενο πράσινης κάρτας
        type: text
        required: true

  - name: projects
    label: Τα έργα μας
    type: collection
    label_singular: Έργο
    path: src/content/projects
    format: json
    filename: "{title}.json"
    view:
      primary: title
      fields: [title, order]
      sort: [order]
    fields:
      - name: title
        label: Τίτλος έργου
        type: string
        required: true
      - name: description
        label: Περιγραφή
        type: text
        required: true
      - name: photos
        label: Φωτογραφίες
        type: image
        required: true
        options:
          multiple:
            max: 30
      - name: dateStart
        label: Ημερομηνία έναρξης
        type: date
        required: true
      - name: dateEnd
        label: Ημερομηνία λήξης (κενό = σε εξέλιξη)
        type: date
      - name: order
        label: Σειρά εμφάνισης
        type: number
        required: true
        options:
          min: 1

  - name: contact
    label: Επικοινωνία
    type: file
    path: src/content/pages/contact.json
    format: json
    fields:
      - name: introTitle
        label: Τίτλος
        type: string
        required: true
      - name: introText
        label: Εισαγωγικό κείμενο
        type: text
        required: true
      - name: introQuote
        label: Κείμενο πράσινης κάρτας
        type: text
        required: true
      - name: formTitle
        label: Τίτλος φόρμας
        type: string
        required: true
      - name: nameLabel
        label: Ετικέτα πεδίου «Όνομα»
        type: string
        required: true
      - name: emailLabel
        label: Ετικέτα πεδίου «Email»
        type: string
        required: true
      - name: phoneLabel
        label: Ετικέτα πεδίου «Τηλέφωνο»
        type: string
        required: true
      - name: messageLabel
        label: Ετικέτα πεδίου «Μήνυμα»
        type: string
        required: true
      - name: submitLabel
        label: Κείμενο κουμπιού αποστολής
        type: string
        required: true
      - name: successTitle
        label: Τίτλος επιτυχίας
        type: string
        required: true
      - name: successText
        label: Κείμενο επιτυχίας
        type: text
        required: true
      - name: errorText
        label: Κείμενο σφάλματος
        type: text
        required: true
      - name: socialTitle
        label: Τίτλος social
        type: string
        required: true
      - name: social
        label: Συνδέσεις social
        type: object
        list: true
        fields:
          - name: platform
            label: Πλατφόρμα
            type: select
            options:
              values:
                - name: facebook
                  label: Facebook
                - name: instagram
                  label: Instagram
                - name: linkedin
                  label: LinkedIn

  - name: footer
    label: Υποσέλιδο
    type: file
    path: src/content/pages/footer.json
    format: json
    fields:
      - name: navTitle
        label: Τίτλος πλοήγησης
        type: string
        required: true
      - name: navLinks
        label: Σύνδεσμοι
        type: object
        list: true
        fields:
          - name: label
            label: Τίτλος συνδέσμου
            type: string
            required: true
          - name: href
            label: Σελίδα (URL)
            type: string
            required: true
      - name: contactTitle
        label: Τίτλος επικοινωνίας
        type: string
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: phone
        label: Τηλέφωνο
        type: string
        required: true
      - name: location
        label: Πόλη
        type: string
        required: true
      - name: social
        label: Social
        type: object
        list: true
        fields:
          - name: platform
            label: Πλατφόρμα
            type: select
            options:
              values:
                - name: facebook
                  label: Facebook
                - name: instagram
                  label: Instagram
                - name: linkedin
                  label: LinkedIn
          - name: href
            label: Σύνδεσμος (URL)
            type: string
            required: true
      - name: ctaTitle
        label: Τίτλος κάρτας εκκίνησης
        type: string
        required: true
      - name: ctaText
        label: Κείμενο κάρτας εκκίνησης
        type: text
        required: true
      - name: copyright
        label: Κείμενο πνευματικών δικαιωμάτων
        type: string
        required: true
      - name: privacyLabel
        label: Τίτλος συνδέσμου απορρήτου
        type: string
        required: true
      - name: termsLabel
        label: Τίτλος συνδέσμου όρων χρήσης
        type: string
        required: true

  - name: privacy
    label: Πολιτική Απορρήτου
    type: file
    path: src/content/pages/privacy.json
    format: json
    fields:
      - name: lastUpdated
        label: Ημερομηνία τελευταίας ενημέρωσης
        type: string
        required: true
      - name: sections
        label: Ενότητες
        type: object
        list: true
        fields:
          - name: heading
            label: Τίτλος ενότητας
            type: string
            required: true
          - name: text
            label: Κείμενο ενότητας
            type: text
            required: true

  - name: terms
    label: Όροι Χρήσης
    type: file
    path: src/content/pages/terms.json
    format: json
    fields:
      - name: lastUpdated
        label: Ημερομηνία τελευταίας ενημέρωσης
        type: string
        required: true
      - name: sections
        label: Ενότητες
        type: object
        list: true
        fields:
          - name: heading
            label: Τίτλος ενότητας
            type: string
            required: true
          - name: text
            label: Κείμενο ενότητας
            type: text
            required: true

media:
  input: src/assets/projects
  output: /src/assets/projects
  rename: safe
